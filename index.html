<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Tecnología o No?</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e1f5fe, #b3e5fc);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 20px;
    }

    .game-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      text-align: center;
      margin-top: 30px;
    }

    h1 {
      color: #0277bd;
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    #question {
      font-size: 1.5rem;
      font-weight: 500;
      color: #01579b;
      margin: 20px 0;
    }

    .button {
      padding: 12px 30px;
      margin: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #4fc3f7;
      color: white;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #0288d1;
      transform: translateY(-2px);
    }

    #feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #1b5e20;
    }

    #feedback.wrong {
      color: #d32f2f;
    }

    #nextBtn, #restartBtn {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      background: #0288d1;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: none;
    }

    #nextBtn:hover, #restartBtn:hover {
      background: #01579b;
      transform: translateY(-2px);
    }

    #icon {
      font-size: 4rem;
      margin: 20px auto;
      color: #0277bd;
      animation: pulse 1.5s infinite;
    }

    #score {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0277bd;
      margin-bottom: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Media Query for Smaller Screens */
    @media (max-width: 576px) {
      h1 { font-size: 2rem; }
      #question { font-size: 1.2rem; }
      .button { font-size: 1rem; padding: 10px 20px; }
      #icon { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Juegos de Tecnología</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="/index.html">Identifica la tecnologia</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/memoria.html">Memoria</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Más Juegos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="w-100 text-center py-3 bg-primary text-white mb-4 rounded">
    <h2 class="m-0">¡Bienvenido a los Juegos de Tecnología!</h2>
    <p class="m-0">Descubre si sabes identificar qué es tecnología y qué no</p>
  </header>

  <!-- Juego -->
  <div class="game-container mx-auto">
    <h1>¿Tecnología o No?</h1>
    <div id="score">Puntuación: 0</div>
    <div id="icon"></div>
    <div id="question">Cargando pregunta...</div>
    <button class="button" onclick="answer('Sí')">✅ Sí</button>
    <button class="button" onclick="answer('No')">❌ No</button>
    <div id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()">Siguiente pregunta</button>
    <button id="restartBtn" onclick="restartGame()">Jugar de nuevo</button>
  </div>

  <!-- Footer -->
  <footer class="w-100 text-center py-3 mt-4 bg-primary text-white rounded">
    <p class="mb-1">¿Quieres jugar más?</p>
    <a href="#" class="btn btn-light btn-sm fw-bold">Explorar más juegos</a>
  </footer>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

  <script>
    const questions = [
      { text: "Computadora", isTech: true, icon: "laptop" },
      { text: "Teléfono celular", isTech: true, icon: "phone" },
      { text: "Videojuego", isTech: true, icon: "controller" },
      { text: "Robot", isTech: true, icon: "robot" },
      { text: "Tablet", isTech: true, icon: "tablet" },
      { text: "Consola de videojuegos", isTech: true, icon: "controller" },
      { text: "Internet", isTech: true, icon: "wifi" },
      { text: "Impresora", isTech: true, icon: "printer" },
      { text: "Cámara digital", isTech: true, icon: "camera" },
      { text: "Smartwatch", isTech: true, icon: "smartwatch" },
      { text: "Semáforo", isTech: true, icon: "traffic-cone" },
      { text: "Cajero automático", isTech: true, icon: "credit-card" },
      { text: "Dron", isTech: true, icon: "drone" },
      { text: "Pantalla táctil", isTech: true, icon: "display" },
      { text: "Proyector", isTech: true, icon: "projector" },
      { text: "Pelota", isTech: false, icon: "basketball" },
      { text: "Lápiz", isTech: false, icon: "pencil" },
      { text: "Bicicleta", isTech: false, icon: "bicycle" },
      { text: "Silla", isTech: false, icon: "chair" },
      { text: "Mesa", isTech: false, icon: "table" },
      { text: "Cuaderno", isTech: false, icon: "journal" },
      { text: "Zapato", isTech: false, icon: "shoe-print" },
      { text: "Gato", isTech: false, icon: "cat" },
      { text: "Planta", isTech: false, icon: "flower" },
      { text: "Sombrero", isTech: false, icon: "hat" },
      { text: "Escoba", isTech: false, icon: "broom" },
      { text: "Martillo", isTech: false, icon: "hammer" },
      { text: "Florero", isTech: false, icon: "flower" },
      { text: "Juguete de peluche", isTech: false, icon: "emoji-smile" },
      { text: "Libro", isTech: false, icon: "book" }
    ];

    let currentIndex = 0;
    let score = 0;
    let shuffledQuestions = [];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startGame() {
      shuffledQuestions = shuffle([ ...questions ]);
      currentIndex = 0;
      score = 0;
      updateScore();
      showQuestion();
      document.getElementById("restartBtn").style.display = "none";
    }

    function updateScore() {
      document.getElementById("score").textContent = "Puntuación: " + score;
    }

    function showQuestion() {
      const question = shuffledQuestions[currentIndex];
      document.getElementById("question").textContent = question.text;
      document.getElementById("icon").innerHTML = `<i class="bi bi-${question.icon}"></i>`;
    }

    function answer(userAnswer) {
      const correctAnswer = shuffledQuestions[currentIndex].isTech ? 'Sí' : 'No';
      const feedback = document.getElementById("feedback");
      if (userAnswer === correctAnswer) {
        feedback.textContent = "¡Correcto!";
        feedback.classList.remove('wrong');
        feedback.classList.add('correct');
        score++;
      } else {
        feedback.textContent = "¡Incorrecto!";
        feedback.classList.remove('correct');
        feedback.classList.add('wrong');
      }
      updateScore();
      document.getElementById("nextBtn").style.display = "block";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= shuffledQuestions.length) {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("restartBtn").style.display = "block";
        document.getElementById("feedback").textContent = "Juego terminado. Tu puntuación es: " + score;
      } else {
        showQuestion();
        document.getElementById("feedback").textContent = "";
        document.getElementById("nextBtn").style.display = "none";
      }
    }

    function restartGame() {
      startGame();
    }

    window.onload = startGame;
  </script>
</body>
</html>
